<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>창원경일고 11월 행사 신청</title>
<meta name="description" content="중3 학생·학부모 초청 — 고교학점제 박람회(11.14), 학부모 차담회(11.17), 학교설명회(11.25) 신청 안내">
<meta name="theme-color" content="#13306b">
<meta property="og:type" content="website">
<meta property="og:title" content="2026년 11월, 창원경일고를 직접 만나보세요!">
<meta property="og:description" content="중3 학생·학부모 초청 행사 3가지 — 원하는 행사를 골라 신청하세요.">
<meta property="og:image" content="https://mathlhk15-glitch.github.io/gyeongil-2027-events/og.png">
<meta property="og:url" content="https://mathlhk15-glitch.github.io/gyeongil-2027-events/">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --navy: #13306b;
    --navy-2: #0d2350;
    --ink: #17202e;
    --ink-2: #4a5568;
    --ink-3: #6b7588;
    --paper: #f4f6fa;
    --card: #ffffff;
    --line: #e3e8f0;
    --pink: #e6007e;
    --yellow: #ffe14d;
    --blue: #1f4fd1;   --blue-soft: #eef3ff;   --blue-line: #cfdcfb;
    --orange: #c2410c; --orange-soft: #fff2ea; --orange-line: #fbd5c0;
    --green: #15803d;  --green-soft: #ecf8f0;  --green-line: #c6ead2;
    --r: 20px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere;
  }
  a { color: inherit; }
  .wrap { max-width: 520px; margin: 0 auto; }

  /* ── 머리 ── */
  .hero { background: var(--navy); color: #fff; padding: 22px 20px 34px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -70px; top: -70px; width: 220px; height: 220px; border-radius: 50%;
    border: 36px solid rgba(255,255,255,.06); pointer-events: none; }
  .school { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
  .school__logo { width: 52px; height: 52px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex-shrink: 0; }
  .school__logo img { width: 48px; height: 48px; display: block; }
  .school__name { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
  .school__en { font-size: 11.5px; opacity: .75; letter-spacing: .2px; }
  .badge-invite { display: inline-block; margin-top: 22px; background: var(--yellow); color: #1b1b1b; font-weight: 800;
    font-size: 14px; padding: 6px 13px; border-radius: 999px; position: relative; z-index: 1; }
  .hero h1 { margin: 12px 0 0; font-size: 29px; line-height: 1.32; font-weight: 800; letter-spacing: -0.8px; position: relative; z-index: 1; }
  .hero h1 em { white-space: nowrap; font-style: normal; color: #fff; background: linear-gradient(transparent 60%, var(--pink) 60%); padding: 0 2px; }
  .hero p { margin: 10px 0 0; font-size: 15.5px; color: #d9e2f5; position: relative; z-index: 1; }

  /* ── 행사 목록 ── */
  .list { padding: 0 16px; margin-top: -18px; position: relative; z-index: 2; display: flex; flex-direction: column; gap: 14px; }
  .ev { background: var(--card); border-radius: var(--r); box-shadow: 0 1px 2px rgba(19,48,107,.06), 0 8px 24px rgba(19,48,107,.08);
    overflow: hidden; border: 1px solid var(--line); }
  .ev__top { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
  .ev__num { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 15px; display: grid; place-items: center; flex-shrink: 0; }
  .ev__name { font-size: 19px; font-weight: 800; letter-spacing: -0.4px; flex: 1; min-width: 0; }
  .ev__status { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 999px; flex-shrink: 0; white-space: nowrap; }
  .ev__body { margin: 0 12px; padding: 14px 14px 12px; border-radius: 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 14px; row-gap: 4px; align-items: center; }
  .ev__icon { grid-row: span 3; width: 52px; height: 52px; border-radius: 14px; background: #fff; display: grid; place-items: center; }
  .ev__date { font-size: 26px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.2; }
  .ev__date small { font-size: 17px; font-weight: 700; margin-left: 2px; }
  .ev__row { display: flex; align-items: center; gap: 6px; font-size: 15.5px; font-weight: 600; color: var(--ink-2); }
  .ev__row svg { flex-shrink: 0; }
  .ev__actions { display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 14px; }
  .btn-apply { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; border-radius: 14px; color: #fff;
    font-size: 17.5px; font-weight: 800; text-decoration: none; letter-spacing: -0.3px; transition: transform .1s, filter .15s; }
  .btn-apply:active { transform: scale(.98); }
  .btn-apply:hover { filter: brightness(1.08); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-sub { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; border-radius: 12px; border: 1px solid var(--line);
    background: #fff; color: var(--ink-2); font: inherit; font-size: 14.5px; font-weight: 700; text-decoration: none; cursor: pointer; }
  .btn-sub:active { background: var(--paper); }

  .ev--blue .ev__num, .ev--blue .btn-apply { background: var(--blue); }
  .ev--blue .ev__name { color: var(--blue); }
  .ev--blue .ev__body { background: var(--blue-soft); border: 1px solid var(--blue-line); }
  .ev--orange .ev__num, .ev--orange .btn-apply { background: var(--orange); }
  .ev--orange .ev__name { color: var(--orange); }
  .ev--orange .ev__body { background: var(--orange-soft); border: 1px solid var(--orange-line); }
  .ev--green .ev__num, .ev--green .btn-apply { background: var(--green); }
  .ev--green .ev__name { color: var(--green); }
  .ev--green .ev__body { background: var(--green-soft); border: 1px solid var(--green-line); }

  .st-soon { background: #fff4c2; color: #6b4e00; }
  .st-today { background: var(--pink); color: #fff; }
  .st-end { background: #e8ebf0; color: #5b6475; }
  .ev.is-ended { opacity: .62; }
  .ev.is-ended .btn-apply { background: #9aa3b2 !important; pointer-events: none; }
  .ev.is-ended .ev__name { color: var(--ink-3) !important; }

  /* ── 안내·문의 ── */
  .info { margin: 22px 16px 0; background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
  .info h2 { margin: 0 0 8px; font-size: 16px; font-weight: 800; }
  .info ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14.5px; }
  .info li + li { margin-top: 4px; }
  .contact { margin: 12px 16px 0; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .btn-call { display: flex; align-items: center; gap: 12px; background: var(--navy); color: #fff; text-decoration: none; border-radius: var(--r); padding: 14px 18px; min-height: 64px; }
  .btn-call small { display: block; font-size: 12.5px; opacity: .8; font-weight: 600; }
  .btn-call b { font-size: 18px; letter-spacing: .3px; }
  .btn-share { width: 64px; border-radius: var(--r); border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--navy); font: inherit; font-size: 11.5px; font-weight: 700; padding: 8px 4px; }
  .footer { text-align: center; color: var(--ink-3); font-size: 12.5px; padding: 22px 16px calc(28px + env(safe-area-inset-bottom)); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: #17202e; color: #fff;
    padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  :focus-visible { outline: 3px solid #f5b400; outline-offset: 2px; }
  @media (min-width: 521px) { .wrap { padding-bottom: 20px; } .hero { border-radius: 0 0 24px 24px; } }
  @media (max-width: 380px) { .ev__name { font-size: 17.5px; } }
  @media (max-width: 350px) { .hero h1 { font-size: 25px; } .ev__date { font-size: 23px; } .btn-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="school">
      <div class="school__logo"><img src="logo.png" alt="창원경일고등학교 교표"></div>
      <div>
        <div class="school__name">창원경일고등학교</div>
        <div class="school__en">Changwon Gyeong il High School</div>
      </div>
    </div>
    <span class="badge-invite">중3 학생·학부모 초청</span>
    <h1>2026년 11월,<br>창원경일고를<br><em>직접 만나보세요!</em></h1>
    <p>참여하실 행사를 골라 신청해 주세요.</p>
  </header>

  <main class="list" id="list">
    <!-- 행사 카드: 아래 EVENTS 데이터로 그립니다 (스크립트가 꺼진 경우를 위한 기본 링크 포함) -->
    <noscript>
      <div class="info" style="margin:0">
        <ul>
          <li><a href="https://m.site.naver.com/2jav3">고교학점제 박람회 신청 (11.14 토)</a></li>
          <li><a href="https://m.site.naver.com/2iYkf">학부모 차담회 신청 (11.17 화)</a></li>
          <li><a href="https://m.site.naver.com/2gMB1">학교설명회 신청 (11.25 수)</a></li>
        </ul>
      </div>
    </noscript>
  </main>

  <section class="info" aria-labelledby="infoTitle">
    <h2 id="infoTitle">신청 안내</h2>
    <ul>
      <li>행사마다 신청이 따로 있습니다. 여러 행사에 참여하시려면 각각 신청해 주세요.</li>
      <li><b>신청하기</b>를 누르면 해당 행사 신청 페이지로 이동합니다.</li>
      <li>행사가 끝나면 이 화면에 ‘행사 종료’로 표시됩니다.</li>
    </ul>
  </section>

  <div class="contact">
    <a class="btn-call" href="tel:0552850455">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>
      <span><small>문의 · 진로진학상담부</small><b>055-285-0455</b></span>
    </a>
    <button class="btn-share" type="button" id="shareBtn" aria-label="이 페이지 공유하기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>
      공유
    </button>
  </div>

  <footer class="footer">창원경일고등학교 · 2026년 11월 중3 학생·학부모 초청 행사</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  // ★ 행사 정보는 여기만 고치면 됩니다. 시각은 한국 시간(+09:00) 기준.
  var EVENTS = [
    { id: 'credit', color: 'blue', name: '고교학점제 박람회', date: '2026-11-14', dow: '토', start: '10:00', end: '15:30',
      place: '본교 체육관', loc: '창원경일고등학교 체육관', map: '창원경일고등학교', apply: 'https://m.site.naver.com/2jav3', icon: 'book' },
    { id: 'tea', color: 'orange', name: '학부모 차담회', date: '2026-11-17', dow: '화', start: '19:00', end: '21:00',
      place: '용호동 투썸플레이스', loc: '창원 용호동 투썸플레이스', map: '창원 용호동 투썸플레이스', apply: 'https://m.site.naver.com/2iYkf', icon: 'cup' },
    { id: 'info', color: 'green', name: '학교설명회', date: '2026-11-25', dow: '수', start: '19:00', end: '21:00',
      place: '본교 본관', loc: '창원경일고등학교 본관', map: '창원경일고등학교', apply: 'https://m.site.naver.com/2gMB1', icon: 'school' }
  ];

  var ICONS = {
    book: '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path>',
    cup: '<path d="M17 8h1a4 4 0 0 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"></path><path d="M6 2v2M10 2v2M14 2v2"></path>',
    school: '<path d="M3 21h18"></path><path d="M5 21V10l7-5 7 5v11"></path><path d="M10 21v-5h4v5"></path><path d="M12 5V2l3 1.5"></path>'
  };
  var COLOR = { blue: '#1f4fd1', orange: '#c2410c', green: '#15803d' };
  var svg = function (inner, color, size) {
    return '<svg width="' + (size || 18) + '" height="' + (size || 18) + '" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') +
      '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
  };
  var I_CLOCK = '<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>';
  var I_PIN = '<path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle>';
  var I_CAL = '<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path>';
  var I_ARROW = '<path d="M5 12h14M13 6l6 6-6 6"></path>';

  // 미리보기용: 주소 끝에 ?now=2026-11-15T09:00 을 붙이면 그 시각 기준으로 표시
  var nowParam = new URLSearchParams(location.search).get('now');
  var now = nowParam ? new Date(nowParam + (/[+Z]/.test(nowParam.slice(10)) ? '' : '+09:00')) : new Date();
  if (isNaN(now)) now = new Date();
  var at = function (d, t) { return new Date(d + 'T' + t + ':00+09:00'); };
  var kstDay = function (dt) { return new Date(dt.getTime() + 9 * 3600e3).toISOString().slice(0, 10); };

  function status(ev) {
    if (now >= at(ev.date, ev.end)) return { cls: 'st-end', text: '행사 종료', ended: true };
    var diff = Math.round((new Date(ev.date + 'T00:00:00Z') - new Date(kstDay(now) + 'T00:00:00Z')) / 86400e3);
    if (diff <= 0) return { cls: 'st-today', text: '오늘' };
    return { cls: 'st-soon', text: 'D-' + diff };
  }
  var md = function (d) { var p = d.split('-'); return (+p[1]) + '.' + (+p[2]) + '.'; };

  var list = document.getElementById('list');
  // 끝난 행사는 아래로 보내 진행 중인 행사가 먼저 보이게 합니다
  var order = EVENTS.map(function (ev, i) { return { ev: ev, i: i, st: status(ev) }; })
    .sort(function (a, b) { return (a.st.ended ? 1 : 0) - (b.st.ended ? 1 : 0) || a.i - b.i; });
  var html = order.map(function (o) {
    var ev = o.ev, i = o.i, st = o.st;
    var c = COLOR[ev.color];
    return '<article class="ev ev--' + ev.color + (st.ended ? ' is-ended' : '') + '" aria-label="' + ev.name + '">' +
      '<div class="ev__top"><span class="ev__num" aria-hidden="true">' + (i + 1) + '</span><h2 class="ev__name" style="margin:0">' + ev.name + '</h2>' +
      '<span class="ev__status ' + st.cls + '">' + st.text + '</span></div>' +
      '<div class="ev__body"><div class="ev__icon">' + svg(ICONS[ev.icon], c, 30) + '</div>' +
      '<div class="ev__date">' + md(ev.date) + '<small>(' + ev.dow + ')</small></div>' +
      '<div class="ev__row">' + svg(I_CLOCK, c) + ev.start + ' ~ ' + ev.end + '</div>' +
      '<div class="ev__row">' + svg(I_PIN, c) + ev.place + '</div></div>' +
      '<div class="ev__actions">' +
      (st.ended
        ? '<span class="btn-apply" aria-disabled="true">행사가 끝났습니다</span>'
        : '<a class="btn-apply" href="' + ev.apply + '" rel="noopener">' + ev.name + ' 신청하기 ' + svg(I_ARROW, '#fff', 20) + '</a>') +
      (st.ended ? '' : '<div class="btn-row">' +
      '<a class="btn-sub" href="https://map.naver.com/p/search/' + encodeURIComponent(ev.map) + '" target="_blank" rel="noopener">' + svg(I_PIN) + '장소 지도</a>' +
      '<button class="btn-sub" type="button" data-ics="' + i + '">' + svg(I_CAL) + '내 일정에 추가</button>' +
      '</div>') + '</div></article>';
  }).join('');
  list.insertAdjacentHTML('beforeend', html);

  var toast = document.getElementById('toast'), tt;
  function say(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { toast.classList.remove('show'); }, 2200); }

  // 일정 추가(.ics) — 휴대폰 기본 캘린더로 열립니다
  list.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ics]'); if (!b) return;
    var ev = EVENTS[+b.dataset.ics];
    var f = function (d, t) { return d.replace(/-/g, '') + 'T' + t.replace(':', '') + '00'; };
    var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Gyeongil HS//2027 Events//KO', 'CALSCALE:GREGORIAN',
      'BEGIN:VTIMEZONE', 'TZID:Asia/Seoul', 'BEGIN:STANDARD', 'DTSTART:19700101T000000', 'TZOFFSETFROM:+0900', 'TZOFFSETTO:+0900', 'TZNAME:KST', 'END:STANDARD', 'END:VTIMEZONE',
      'BEGIN:VEVENT', 'UID:' + ev.id + '-2026@gyeongil', 'DTSTAMP:20261029T000000Z',
      'DTSTART;TZID=Asia/Seoul:' + f(ev.date, ev.start), 'DTEND;TZID=Asia/Seoul:' + f(ev.date, ev.end),
      'SUMMARY:창원경일고 ' + ev.name, 'LOCATION:' + (ev.loc || ev.place), 'DESCRIPTION:문의 진로진학상담부 055-285-0455',
      'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', 'DESCRIPTION:내일 ' + ev.name, 'END:VALARM',
      'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    try {
      var url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
      var a = document.createElement('a'); a.href = url; a.download = 'gyeongil-' + ev.id + '.ics';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      say('일정 파일을 열면 캘린더에 추가됩니다');
    } catch (err) { say('이 기기에서는 일정 추가가 어렵습니다'); }
  });

  // 공유: 휴대폰 공유창(카카오톡 등), 안 되면 주소 복사
  document.getElementById('shareBtn').addEventListener('click', function () {
    var data = { title: '창원경일고 11월 행사 신청', text: '중3 학생·학부모 초청 행사 3가지 — 원하는 행사를 골라 신청하세요.', url: location.href.split('?')[0] };
    if (navigator.share) { navigator.share(data).catch(function () {}); return; }
    var done = function () { say('주소를 복사했습니다'); };
    if (navigator.clipboard) navigator.clipboard.writeText(data.url).then(done, function () { say(data.url); });
    else say(data.url);
  });
})();
</script>
</body>
</html>
